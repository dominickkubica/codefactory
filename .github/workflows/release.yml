# Publishes a release when a version tag (v1.2.3) is pushed:
#   1. checks the tag matches the version in pyproject.toml, and that the tests pass
#   2. builds the sdist and wheel reproducibly (SOURCE_DATE_EPOCH = the tagged commit's time)
#   3. writes a CycloneDX SBOM with codefactory itself
#   4. attests build provenance (SLSA) and the SBOM with GitHub's signing (Sigstore), verifiable with
#      `gh attestation verify <file> --repo dominickkubica/codefactory`
#   5. creates the GitHub release with the files and their SHA-256 sums, and moves the major tag (v0) to it,
#      so `uses: dominickkubica/codefactory@v0` follows releases
#   6. publishes to PyPI by trusted publishing (no token stored) when the repository variable PYPI_PUBLISH is "true",
#      as codefactory-cli: "codefactory" on PyPI is an unrelated project. Installs from git keep the name codefactory
#      (renaming it would make `pip install "codefactory @ git+…"`, used by installed hooks, fall back to PyPI's).
# Every action is pinned to a commit; the comment says which version it is.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v$version" = "$TAG" || { echo "::error::tag $TAG but pyproject.toml says $version"; exit 1; }
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build (reproducible)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          # the build backend at exact, hash-checked versions: a new setuptools can't change (or get into) the release
          pip install --quiet --require-hashes --no-deps -r build-requirements.txt
          python -m build --no-isolation
          python tools/reproducible_sdist.py dist/*.tar.gz
          pip install --quiet dist/*.whl
          codefactory sbom . -o dist/codefactory.cdx.json
          cd dist && sha256sum * > SHA256SUMS
      - name: Build the PyPI package (named codefactory-cli)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          sed -i 's/^name = "codefactory"$/name = "codefactory-cli"/' pyproject.toml
          grep -q '^name = "codefactory-cli"$' pyproject.toml
          python -m build --no-isolation -o pypi
          python tools/reproducible_sdist.py pypi/*.tar.gz
          git checkout -- pyproject.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: pypi/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and the major tag
      id-token: write # signing the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: pypi/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz, pypi/*.whl, pypi/*.tar.gz"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*.whl"
          sbom-path: dist/codefactory.cdx.json
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create the release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # made on the website (which also made the tag): add the files and the notes to it
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "codefactory $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "codefactory $TAG" --notes-file notes.md --verify-tag
          fi
          major="${TAG%%.*}"
          newest="$(git tag -l "$major.*.*" | sort -V | tail -1)"
          if [ "$newest" = "$TAG" ]; then  # a backport (v0.19.5 after v0.20.2) mustn't move v0 back
            git tag -f "$major" "$TAG^{commit}"
            git push -f origin "refs/tags/$major"
          else
            echo "$TAG isn't the newest $major release ($newest is): $major stays where it is"
          fi

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI trusts this workflow, no token is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
