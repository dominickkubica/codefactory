[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefactory"
version = "0.9.2"
description = "See a codebase as a factory floor, find what's wrong with it (copies, N+1 loops, dead code, import loops, security and reliability problems), and turn it into ranked work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

keywords = ["static analysis", "code review", "architecture", "call graph", "duplicate code", "refactoring", "sarif", "claude code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: JavaScript",
    "Programming Language :: Go",
    "Programming Language :: Java",
    "Programming Language :: Rust",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/dominickkubica/codefactory"
Documentation = "https://github.com/dominickkubica/codefactory/blob/main/docs/USAGE.md"
Design = "https://github.com/dominickkubica/codefactory/blob/main/docs/DESIGN.md"
Changelog = "https://github.com/dominickkubica/codefactory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Go, Java, Kotlin, Swift, Rust, C/C++, C#, Ruby, PHP, Scala, Dart, Lua, Elixir and more (grammars download on first use)
languages = ["tree-sitter>=0.25", "tree-sitter-language-pack>=1.0,<2"]

[project.scripts]
codefactory = "codefactory.cli:main"

[tool.setuptools.packages.find]
include = ["codefactory*"]

[tool.setuptools.package-data]
"codefactory.viewer" = ["*.html", "*.css", "*.js"]
"codefactory.analyzers" = ["*.js"]
"codefactory.skill_template" = ["*.md"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["SIM108"]  # a ternary isn't always clearer than an if/else

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixture source code inside strings
