[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codefactory"
version = "0.1.0"
description = "See a codebase as a factory floor and find dead code, duplicates, import loops and bottlenecks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Quality Assurance"]

[project.scripts]
codefactory = "codefactory.cli:main"

[tool.setuptools.packages.find]
include = ["codefactory*"]

[tool.setuptools.package-data]
"codefactory.viewer" = ["*.html", "*.css", "*.js"]
"codefactory.analyzers" = ["*.js"]
